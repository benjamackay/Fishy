services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    # La base de datos ahora es Supabase (Postgres administrado).
    # Las credenciales de conexion viven en `.env` (ver `.env.example`).
    env_file:
      - .env
    networks:
      - fishy-net

networks:
  fishy-net:
    driver: bridge
