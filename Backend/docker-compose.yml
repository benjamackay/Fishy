services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: juego_db
      POSTGRES_USER: juego_user
      POSTGRES_PASSWORD: supersecreta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: "cambiar-esto-en-produccion"
      DJANGO_DEBUG: "True"
      DB_NAME: juego_db
      DB_USER: juego_user
      DB_PASSWORD: supersecreta
      DB_HOST: db
      DB_PORT: "5432"

volumes:
  postgres_data:
